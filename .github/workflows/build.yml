name: Build Vili -NEXTGEN Kernel (MiYume + Official Vili Hardware)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Build Dependencies & Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            clang-18 lld-18 llvm-18 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          mkdir -p $HOME/clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            ln -sf /usr/bin/${tool}-18 $HOME/clang/bin/${tool}
          done

      - name: Checkout MiYume Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Import Official Vili Hardware Drivers (DTS, Camera, Audio, Display)
        run: |
          # Clone LineageOS SM8350 kernel source containing official vili hardware support
          git clone --depth=1 https://github.com -b lineage-21 vili_ref

          # 1. Copy Vili Device Tree files (Fixes Audio, Camera, Flashlight & Display Panel Nodes)
          cp -rf vili_ref/arch/arm64/boot/dts/vendor/qcom/vili* arch/arm64/boot/dts/vendor/qcom/ || true
          cp -rf vili_ref/arch/arm64/boot/dts/vendor/qcom/dsi-panel-k3s* arch/arm64/boot/dts/vendor/qcom/ || true
          cp -f vili_ref/arch/arm64/boot/dts/vendor/qcom/Makefile arch/arm64/boot/dts/vendor/qcom/Makefile || true

          # 2. Import Vili Camera & Flashlight drivers
          cp -rf vili_ref/techpack/camera/* techpack/camera/ || true

          # 3. Import Vili Audio codec & platform configs
          cp -rf vili_ref/techpack/audio/* techpack/audio/ || true

          # 4. Import Vili Display panel drivers (Fixes Boot Animation Peak Brightness)
          cp -rf vili_ref/techpack/display/* techpack/display/ || true

          # 5. Copy official vili config fragments if available
          mkdir -p arch/arm64/configs/vendor/xiaomi
          cp -rf vili_ref/arch/arm64/configs/vendor/xiaomi/vili.config arch/arm64/configs/vendor/xiaomi/ || true
          cp -rf vili_ref/arch/arm64/configs/vendor/xiaomi/sm8350-common.config arch/arm64/configs/vendor/xiaomi/ || true

          rm -rf vili_ref

      - name: Update ReSukiSU to Latest Version
        run: |
          if [ -d "KernelSU" ]; then
            cd KernelSU
            git fetch --all --tags
            LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "main")
            git checkout "$LATEST_TAG" || git checkout main || true
            cd ..
          fi

      - name: Bypass Module Symbol CRC Check (Load Stock Vendor .ko Modules)
        run: |
          python3 -c '
          with open("kernel/module.c", "r") as f:
              code = f.read()
          target = "static int check_version(const struct load_info *info,"
          if target in code:
              idx = code.find("{", code.find(target)) + 1
              code = code[:idx] + "\n\treturn 1;" + code[idx:]
              with open("kernel/module.c", "w") as f:
                  f.write(code)
              print("Successfully patched check_version!")
          '

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Configure & Compile Vili Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"

          make O=out ARCH=arm64 vili_defconfig

          # Merge official vili.config fragment on top of your MiYume vili_defconfig
          if [ -f arch/arm64/configs/vendor/xiaomi/vili.config ]; then
            chmod +x scripts/kconfig/merge_config.sh
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/xiaomi/vili.config
          fi

          # Ensure -NEXTGEN version, Manual Hook for 5.4 ReSukiSU, and clean symbol resolution
          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-NEXTGEN" \
            -d LOCALVERSION_AUTO \
            -d KSU_SUSFS \
            -d KSU_TRACEPOINT_HOOK \
            -e KSU_MANUAL_HOOK \
            -e KSU \
            -e MACH_XIAOMI_VILI \
            -d MACH_XIAOMI_VENUS

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package with AnyKernel3 (Include Vili DTB + Image)
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          # Include compiled vili DTB so Camera, Audio, and Display panel nodes match vili hardware
          if [ -f out/arch/arm64/boot/dts/vendor/qcom/vili-sm8350.dtb ]; then
            cp out/arch/arm64/boot/dts/vendor/qcom/vili-sm8350.dtb AnyKernel3/dtb
          fi
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=vili/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          zip -r9 ../vili-NEXTGEN-MiYume-Full.zip * -x .git README.md *placeholder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vili-NEXTGEN-MiYume-Full
          path: |
            vili-NEXTGEN-MiYume-Full.zip
            out/arch/arm64/boot/Image
