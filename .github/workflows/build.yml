name: Build Vili -NEXTGEN Kernel (Fast Build)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Ensure KernelSU Source Exists
        run: |
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev clang lld llvm python3 python-is-python3 cpio

      - name: Configure Kernel (Vili + Port ROM + Root)
        run: |
          make O=out ARCH=arm64 vili_defconfig
          ./scripts/config --file out/.config \
            -e OVERLAY_FS \
            -e TMPFS_XATTR \
            -e EROFS_FS \
            -e BPF_SYSCALL \
            -e BPF_JIT \
            -e KSU \
            -e KSU_SUSFS \
            -e QCOM_RPMH \
            -e QCOM_SMEM \
            -e QCOM_SCM \
            -e GH_RM_DRV \
            -e GH_MSGQ \
            -d SENSORS_QTI_AMOLED_ECM \
            -d QCOM_FSA4480_I2C \
            -d BACKLIGHT_QCOM_SPMI_WLED \
            -d BUILD_ARM64_APPENDED_DTB_IMAGE
          make O=out ARCH=arm64 olddefconfig

      - name: Compile Pure Image
        run: |
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image
          test -f out/arch/arm64/boot/Image || (echo "ERROR: Pure Image not generated!" && exit 1)

      - name: Package Pure Image with AnyKernel3
        run: |
          rm -rf AnyKernel3 vili-NEXTGEN-Final.zip
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cp -f out/arch/arm64/boot/Image AnyKernel3/Image
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          (cd AnyKernel3 && zip -r9 ../vili-NEXTGEN-Final.zip . -x "*.git*" "README.md" "*placeholder*")
          unzip -l vili-NEXTGEN-Final.zip

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vili-NEXTGEN-Final
          path: vili-NEXTGEN-Final.zip
