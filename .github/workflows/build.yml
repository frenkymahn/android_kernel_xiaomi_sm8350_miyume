name: Build Kernel for Xiaomi 11T Pro (vili)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel for Xiaomi 11T Pro (vili)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev lz4 make optipng bc libssl-dev libelf-dev libfl-dev python3 python-is-python3 device-tree-compiler

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git toolchain/clang

      - name: Compile Kernel Image & DTBs
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          MAKE_PARAMS=(
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
          )

          make O=out "${MAKE_PARAMS[@]}" vili_defconfig

          # Touchscreen driver linker fixes
          sed -i 's/CONFIG_TOUCHSCREEN_ST_FTS_V521_SPI=y/# CONFIG_TOUCHSCREEN_ST_FTS_V521_SPI is not set/' out/.config
          sed -i 's/CONFIG_TOUCHSCREEN_CYPRESS_CYTTSP5=y/# CONFIG_TOUCHSCREEN_CYPRESS_CYTTSP5 is not set/' out/.config
          sed -i 's/CONFIG_TOUCHSCREEN_CYPRESS_CYTTSP5_I2C=y/# CONFIG_TOUCHSCREEN_CYPRESS_CYTTSP5_I2C is not set/' out/.config
          sed -i 's/CONFIG_TOUCHSCREEN_CYPRESS_CYTTSP5_DEVICE_ACCESS=y/# CONFIG_TOUCHSCREEN_CYPRESS_CYTTSP5_DEVICE_ACCESS is not set/' out/.config
          sed -i 's/CONFIG_TOUCHSCREEN_CYPRESS_CYTTSP5_LOADER=y/# CONFIG_TOUCHSCREEN_CYPRESS_CYTTSP5_LOADER is not set/' out/.config

          make -j$(nproc --all) O=out "${MAKE_PARAMS[@]}" Image dtbs

      - name: Package with AnyKernel3 (Venus Style - 46MB Appended Image)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel

          # 1. Copy raw Image
          cp out/arch/arm64/boot/Image anykernel/Image

          # 2. Search entire out/ folder for DTB files and append
          echo "Searching for compiled DTB files in out/..."
          DTB_LIST=$(find out/ -type f -name "*.dtb" ! -name ".*")
          echo "Found DTBs:"
          echo "$DTB_LIST"

          if [ -n "$DTB_LIST" ]; then
            for dtb in $DTB_LIST; do
              cat "$dtb" >> anykernel/Image
            done
          fi

          # 3. Check final size
          IMAGE_SIZE=$(stat -c%s anykernel/Image 2>/dev/null || stat -f%z anykernel/Image)
          echo "=========================================="
          echo "Generated Image Size: $IMAGE_SIZE bytes"
          ls -lh anykernel/Image
          echo "=========================================="

          # Optional root payloads
          [ -f phantom-package.json ] && cp phantom-package.json anykernel/
          [ -d patch ] && cp -r patch anykernel/

          # Setup anykernel.sh for vili
          sed -i 's/kernel.string=.*/kernel.string=Next-Gen Kernel For Xiaomi 11T Pro (vili)/g' anykernel/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=vili/g' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=viliin/g' anykernel/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=haydn/g' anykernel/anykernel.sh
          sed -i 's/block=auto/block=boot/g' anykernel/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/g' anykernel/anykernel.sh

          cd anykernel
          ZIP_NAME="Next-Gen-vili-$(date +'%Y%m%d_%H%M%S').zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_PATH }}
          path: ${{ env.ZIP_PATH }}
