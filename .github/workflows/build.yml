name: Build Vili -NEXTGEN Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Build Dependencies & Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            clang-18 lld-18 llvm-18 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          mkdir -p $HOME/clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            ln -sf /usr/bin/${tool}-18 $HOME/clang/bin/${tool}
          done

      - name: Checkout MiYume Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Update ReSukiSU Driver
        run: |
          git submodule update --remote --merge KernelSU || true

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Configure & Compile Vili Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"

          # Load your verified vili_defconfig directly
          make O=out ARCH=arm64 vili_defconfig

          # Only ensure LOCALVERSION stays strictly "-NEXTGEN" without extra git suffixes
          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-NEXTGEN" \
            -d LOCALVERSION_AUTO

          make O=out ARCH=arm64 olddefconfig

          # Compile the kernel
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=vili/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          zip -r9 ../vili-NEXTGEN-Kernel.zip * -x .git README.md *placeholder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vili-NEXTGEN-Kernel
          path: |
            vili-NEXTGEN-Kernel.zip
            out/arch/arm64/boot/Image
