name: Build Kernel for Xiaomi 11T Pro (vili)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel for Xiaomi 11T Pro (vili)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev lz4 make optipng bc libssl-dev libelf-dev libfl-dev python3 python-is-python3 device-tree-compiler

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git toolchain/clang

      - name: Compile Kernel Image & DTB
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          MAKE_PARAMS=(
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
          )

          make O=out "${MAKE_PARAMS[@]}" vili_defconfig
          make -j$(nproc --all) O=out "${MAKE_PARAMS[@]}" Image dtbs

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel

          # Copy Kernel Image
          cp out/arch/arm64/boot/Image anykernel/

          # Concatenate device tree blobs for Lahaina
          find out/arch/arm64/boot/dts/vendor/qcom -name "*lahaina*.dtb" -exec cat {} + > anykernel/dtb 2>/dev/null || true

          cd anykernel
          sed -i 's/device.name1=.*/device.name1=vili/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=viliin/g' anykernel.sh

          ZIP_NAME="Next-Gen-vili-$(date +'%Y%m%d_%H%M%S').zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_PATH }}
          path: ${{ env.ZIP_PATH }}
