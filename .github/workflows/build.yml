name: Build Vili -NEXTGEN Kernel (Fast Build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Fast Minimal Dependencies & Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison build-essential ccache curl flex \
            libssl-dev libelf-dev python3 zip unzip cpio \
            clang-18 lld-18 llvm-18 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          mkdir -p $HOME/clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            ln -sf /usr/bin/${tool}-18 $HOME/clang/bin/${tool}
          done

      - name: Checkout MiYume Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup CCache for Ultra-Fast Rebuilds
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-vili-${{ github.run_id }}
          restore-keys: |
            ccache-vili-

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Update ReSukiSU to Latest Version
        run: |
          if [ -d "KernelSU" ]; then
            cd KernelSU
            git fetch --all --tags
            LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "main")
            git checkout "$LATEST_TAG" || git checkout main || true
            cd ..
          fi

      - name: Patch Module Symbol CRC Check
        run: |
          python3 -c '
          with open("kernel/module.c", "r") as f:
              code = f.read()
          target = "static int check_version(const struct load_info *info,"
          if target in code:
              idx = code.find("{", code.find(target)) + 1
              code = code[:idx] + "\n\treturn 1;" + code[idx:]
              with open("kernel/module.c", "w") as f:
                  f.write(code)
              print("Successfully patched check_version!")
          '

      - name: Configure & Fast Compile Vili Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G

          make O=out ARCH=arm64 vili_defconfig

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-NEXTGEN" \
            -d LOCALVERSION_AUTO \
            -d KSU_SUSFS \
            -d KSU_TRACEPOINT_HOOK \
            -e KSU_MANUAL_HOOK \
            -e KSU \
            -e MACH_XIAOMI_VILI \
            -d MACH_XIAOMI_VENUS \
            -d BQ_FG_1S \
            -e QTI_BATTERY_CHARGER \
            -e SND_SOC_CS35L41 \
            -e SND_SOC_CS35L41_I2C

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 Image modules \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

          ccache -s

      - name: Package with AnyKernel3 (Working DTB + DTBO + Vendor Modules)
        run: |
          export PATH="$HOME/clang/bin:$PATH"

          # 1. Copy Kernel Image + Proven Working DTB & DTBO
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cp prebuilt_vili/dtb AnyKernel3/dtb
          cp prebuilt_vili/dtbo.img AnyKernel3/dtbo.img

          # 2. Strip & copy all compiled .ko modules (Audio, Camera, Flash, Wi-Fi)
          make O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            STRIP=llvm-strip \
            INSTALL_MOD_PATH=modules_out \
            INSTALL_MOD_STRIP=1 \
            modules_install

          mkdir -p AnyKernel3/modules/vendor/lib/modules
          mkdir -p AnyKernel3/modules/system/lib/modules
          find out/modules_out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          find out/modules_out -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \;

          # 3. Configure AnyKernel3 & flash dtbo.img alongside boot
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=vili/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=umi/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=auto;|' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' anykernel.sh
          sed -i 's/do.modules=.*/do.modules=1;/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1;/' anykernel.sh

          python3 -c '
          with open("anykernel.sh", "r") as f:
              sh = f.read()
          dtbo_flash = """
          if [ -f "$home/dtbo.img" ]; then
            ui_print "Flashing dtbo.img...";
            flash_generic dtbo;
          fi;
          flash_boot;"""
          if "flash_boot;" in sh:
              sh = sh.replace("flash_boot;", dtbo_flash)
          else:
              sh = sh.replace("write_boot;", dtbo_flash.replace("flash_boot;", "write_boot;"))
          with open("anykernel.sh", "w") as f:
              f.write(sh)
          '

          zip -r9 ../vili-NEXTGEN-Final.zip * -x .git README.md *placeholder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vili-NEXTGEN-Final
          path: |
            vili-NEXTGEN-Final.zip
            out/arch/arm64/boot/Image
