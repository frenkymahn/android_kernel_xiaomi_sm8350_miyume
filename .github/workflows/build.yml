name: Build Vili -NEXTGEN Kernel (MiYume + Official Xiaomi MiCode Vili)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Build Dependencies & Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            clang-18 lld-18 llvm-18 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          mkdir -p $HOME/clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            ln -sf /usr/bin/${tool}-18 $HOME/clang/bin/${tool}
          done

      - name: Checkout MiYume Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Checkout Official Xiaomi MiCode Vili Source (vili-r-oss)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: vili-r-oss
          path: micode_vili
          fetch-depth: 1

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Import Official Xiaomi Vili Hardware (DTS, Panel, Camera, Audio)
        run: |
          # 1. Import Xiaomi's official vili Device Tree & K3S Display Panel files
          mkdir -p arch/arm64/boot/dts/vendor/qcom
          cp -rf micode_vili/arch/arm64/boot/dts/vendor/qcom/vili* arch/arm64/boot/dts/vendor/qcom/ || true
          cp -rf micode_vili/arch/arm64/boot/dts/vendor/qcom/dsi-panel-k3s* arch/arm64/boot/dts/vendor/qcom/ || true
          cp -rf micode_vili/arch/arm64/boot/dts/qcom/vili* arch/arm64/boot/dts/qcom/ || true

          # 2. Import Xiaomi's official vili Camera & Flashlight sensor configs (without breaking MiYume headers)
          cp -rf micode_vili/techpack/camera/drivers/cam_sensor_module/cam_sensor/* techpack/camera/drivers/cam_sensor_module/cam_sensor/ || true
          cp -rf micode_vili/techpack/camera/drivers/cam_sensor_module/cam_flash/* techpack/camera/drivers/cam_sensor_module/cam_flash/ || true

          # 3. Import Xiaomi's official vili Audio machine & codec configs
          cp -rf micode_vili/techpack/audio/asoc/lahaina.c techpack/audio/asoc/lahaina.c || true
          cp -rf micode_vili/techpack/audio/asoc/codecs/cs35l41* techpack/audio/asoc/codecs/ || true

          # 4. Import Xiaomi's official vili Display panel brightness & MI_DISP files
          cp -rf micode_vili/techpack/display/msm/dsi/dsi_panel* techpack/display/msm/dsi/ || true
          cp -rf micode_vili/techpack/display/msm/mi_disp/* techpack/display/msm/mi_disp/ || true

          rm -rf micode_vili

      - name: Update ReSukiSU to Latest Version (v4.2.0-rc3)
        run: |
          if [ -d "KernelSU" ]; then
            cd KernelSU
            git fetch --all --tags
            LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "main")
            git checkout "$LATEST_TAG" || git checkout main || true
            cd ..
          fi

      - name: Patch Boot Brightness & Stock Vendor Module Symbol CRC Check
        run: |
          python3 -c '
          import glob, re

          # 1. Limit initial boot backlight level to prevent peak brightness flash
          for path in glob.glob("techpack/display/msm/dsi/*.c"):
              with open(path, "r", errors="ignore") as f:
                  content = f.read()
              new_content = re.sub(
                  r"(bl_config->bl_level\s*=\s*)bl_config->bl_max_level;",
                  r"\1(bl_config->bl_max_level / 4);",
                  content
              )
              if new_content != content:
                  with open(path, "w") as f:
                      f.write(new_content)
                  print(f"Patched boot peak brightness in {path}")

          # 2. Bypass Module Symbol CRC Check so Stock HyperOS V816.0.22.0 .ko Modules Load Cleanly
          with open("kernel/module.c", "r") as f:
              code = f.read()
          target = "static int check_version(const struct load_info *info,"
          if target in code:
              idx = code.find("{", code.find(target)) + 1
              code = code[:idx] + "\n\treturn 1;" + code[idx:]
              with open("kernel/module.c", "w") as f:
                  f.write(code)
              print("Successfully patched check_version!")
          '

      - name: Configure & Compile Vili Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"

          make O=out ARCH=arm64 vili_defconfig

          # Ensure -NEXTGEN version, Manual Hook for 5.4 ReSukiSU v4.2.0-rc3, and Vili hardware flags
          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-NEXTGEN" \
            -d LOCALVERSION_AUTO \
            -d KSU_SUSFS \
            -d KSU_TRACEPOINT_HOOK \
            -e KSU_MANUAL_HOOK \
            -e KSU \
            -e MACH_XIAOMI_VILI \
            -d MACH_XIAOMI_VENUS \
            -e SND_SOC_CS35L41 \
            -e SND_SOC_CS35L41_I2C

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          if [ -f out/arch/arm64/boot/dts/vendor/qcom/vili-sm8350.dtb ]; then
            cp out/arch/arm64/boot/dts/vendor/qcom/vili-sm8350.dtb AnyKernel3/dtb
          fi
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=vili/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          zip -r9 ../vili-NEXTGEN-MiCode-Full.zip * -x .git README.md *placeholder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vili-NEXTGEN-MiCode-Full
          path: |
            vili-NEXTGEN-MiCode-Full.zip
            out/arch/arm64/boot/Image
